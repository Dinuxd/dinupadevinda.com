<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TransformerScope GPT-2 interpretability workflow</title>
  <desc id="desc">Diagram showing prompt tokens, GPT-2 small, logit lens, attention inspection, ablation, activation patching, static portfolio samples, and local dashboard boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.55" stop-color="#07101d"/>
      <stop offset="1" stop-color="#0a1825"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#43d8ff"/>
      <stop offset="1" stop-color="#5ff4b4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <style>
      .grid { stroke: rgba(148, 210, 235, 0.09); stroke-width: 1; }
      .box { fill: rgba(10, 30, 44, 0.86); stroke: rgba(93, 234, 211, 0.62); stroke-width: 2; filter: url(#softShadow); }
      .muted { fill: rgba(13, 22, 35, 0.88); stroke: rgba(148, 163, 184, 0.36); stroke-width: 1.5; }
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #f8fbff; letter-spacing: -0.02em; }
      .eyebrow { font: 800 17px Inter, Arial, sans-serif; fill: #5ff4b4; letter-spacing: 0.22em; }
      .label { font: 800 22px Inter, Arial, sans-serif; fill: #f8fbff; }
      .small { font: 600 14px Inter, Arial, sans-serif; fill: #a8b5c7; }
      .tiny { font: 700 12px Inter, Arial, sans-serif; fill: #6ee7ff; letter-spacing: 0.05em; }
      .arrow { stroke: url(#cyan); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #5ff4b4; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 10 12; fill: none; marker-end: url(#arrowGreen); }
      .note { font: 700 14px Inter, Arial, sans-serif; fill: #c9d6e6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4ee8cf"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5ff4b4"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <g opacity="0.9">
    <path class="grid" d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
    <path class="grid" d="M120 0v760M240 0v760M360 0v760M480 0v760M600 0v760M720 0v760M840 0v760M960 0v760M1080 0v760"/>
  </g>

  <text x="58" y="64" class="eyebrow">TRANSFORMERSCOPE</text>
  <text x="58" y="111" class="title">GPT-2 interpretability workbench</text>
  <text x="60" y="145" class="small">Local tools for next-token prediction, logit lens, attention inspection, ablations, and causal checks.</text>

  <rect x="58" y="208" width="158" height="86" rx="16" class="box"/>
  <text x="86" y="244" class="label">Prompt</text>
  <text x="83" y="268" class="small">Text input</text>

  <rect x="278" y="208" width="180" height="86" rx="16" class="box"/>
  <text x="307" y="244" class="label">Tokenizer</text>
  <text x="311" y="268" class="small">GPT-2 BPE tokens</text>

  <rect x="520" y="180" width="240" height="142" rx="20" class="box"/>
  <text x="564" y="221" class="label">GPT-2 small</text>
  <text x="568" y="249" class="small">12 layers / 12 heads</text>
  <text x="568" y="274" class="small">124M parameters</text>
  <text x="568" y="299" class="small">Local PyTorch inference</text>

  <path class="arrow" d="M216 251h52"/>
  <path class="arrow" d="M458 251h52"/>

  <rect x="830" y="88" width="260" height="86" rx="16" class="muted"/>
  <text x="861" y="123" class="label">Logit lens</text>
  <text x="862" y="148" class="small">Residual-stream projections</text>

  <rect x="830" y="216" width="260" height="86" rx="16" class="muted"/>
  <text x="861" y="251" class="label">Attention view</text>
  <text x="862" y="276" class="small">Layer/head token weights</text>

  <rect x="830" y="344" width="260" height="86" rx="16" class="muted"/>
  <text x="861" y="379" class="label">Interventions</text>
  <text x="862" y="404" class="small">Mean ablation, patching</text>

  <path class="arrow" d="M760 220c38-58 44-88 62-88"/>
  <path class="arrow" d="M760 251h60"/>
  <path class="arrow" d="M760 282c38 58 44 100 62 100"/>

  <rect x="80" y="492" width="255" height="118" rx="18" class="box"/>
  <text x="113" y="529" class="label">Local dashboard</text>
  <text x="114" y="557" class="small">Full trusted-machine UI</text>
  <text x="114" y="582" class="small">CLI + JSON artifacts</text>

  <rect x="430" y="492" width="300" height="118" rx="18" class="box"/>
  <text x="463" y="529" class="label">Reviewed results</text>
  <text x="464" y="557" class="small">Final evaluation and controls</text>
  <text x="464" y="582" class="small">Negative evidence preserved</text>

  <rect x="825" y="492" width="290" height="118" rx="18" class="box"/>
  <text x="860" y="529" class="label">Portfolio preview</text>
  <text x="861" y="557" class="small">Static safe samples</text>
  <text x="861" y="582" class="small">No public arbitrary scans</text>

  <path class="dash" d="M640 322v118c0 34-20 52-58 52"/>
  <path class="arrow" d="M335 551h84"/>
  <path class="arrow" d="M730 551h84"/>

  <g transform="translate(58 666)">
    <rect width="118" height="34" rx="8" fill="rgba(67,216,255,0.13)" stroke="rgba(67,216,255,0.55)"/>
    <text x="30" y="23" class="tiny">GPT-2</text>
  </g>
  <g transform="translate(196 666)">
    <rect width="128" height="34" rx="8" fill="rgba(67,216,255,0.13)" stroke="rgba(67,216,255,0.55)"/>
    <text x="24" y="23" class="tiny">Logit lens</text>
  </g>
  <g transform="translate(344 666)">
    <rect width="140" height="34" rx="8" fill="rgba(67,216,255,0.13)" stroke="rgba(67,216,255,0.55)"/>
    <text x="24" y="23" class="tiny">Attention</text>
  </g>
  <g transform="translate(504 666)">
    <rect width="126" height="34" rx="8" fill="rgba(95,244,180,0.13)" stroke="rgba(95,244,180,0.55)"/>
    <text x="24" y="23" class="tiny" fill="#5ff4b4">Ablation</text>
  </g>
  <g transform="translate(650 666)">
    <rect width="170" height="34" rx="8" fill="rgba(95,244,180,0.13)" stroke="rgba(95,244,180,0.55)"/>
    <text x="24" y="23" class="tiny" fill="#5ff4b4">Static demo</text>
  </g>

  <text x="840" y="690" class="note">Full dashboard remains local by design.</text>
</svg>
