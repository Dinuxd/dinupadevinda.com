<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TransformerScope workflow</title>
  <desc id="desc">A clean workflow diagram for TransformerScope showing GPT-2 input, local analysis tools, result artifacts, and a static portfolio preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061524"/>
      <stop offset="1" stop-color="#08111c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#38d5ff"/>
      <stop offset="1" stop-color="#62f2b8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#62f2b8"/>
    </marker>
    <style>
      .grid { stroke: rgba(148, 210, 235, 0.075); stroke-width: 1; }
      .panel { fill: rgba(8, 23, 37, 0.92); stroke: rgba(125, 211, 252, 0.34); stroke-width: 1.5; }
      .box { fill: rgba(11, 31, 49, 0.96); stroke: rgba(94, 234, 212, 0.62); stroke-width: 2; }
      .box2 { fill: rgba(14, 23, 35, 0.96); stroke: rgba(148, 163, 184, 0.42); stroke-width: 1.5; }
      .flow { stroke: url(#line); stroke-width: 5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .thin { stroke: rgba(94, 234, 212, 0.52); stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .title { font: 800 44px Inter, Arial, sans-serif; fill: #f8fbff; letter-spacing: -0.02em; }
      .eyebrow { font: 800 16px Inter, Arial, sans-serif; fill: #61f1bb; letter-spacing: 0.22em; }
      .h { font: 800 22px Inter, Arial, sans-serif; fill: #f8fbff; }
      .t { font: 600 15px Inter, Arial, sans-serif; fill: #9fb0c4; }
      .small { font: 700 13px Inter, Arial, sans-serif; fill: #c8d5e6; }
      .tag { font: 800 12px Inter, Arial, sans-serif; fill: #5be7ff; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#background)"/>
  <g>
    <path class="grid" d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
    <path class="grid" d="M150 0v760M300 0v760M450 0v760M600 0v760M750 0v760M900 0v760M1050 0v760"/>
  </g>

  <text x="60" y="70" class="eyebrow">TRANSFORMERSCOPE</text>
  <text x="60" y="122" class="title">Inside a GPT-2 prediction</text>
  <text x="62" y="156" class="t">Local interpretability tools for logits, attention, interventions, and saved experiment results.</text>

  <rect x="58" y="205" width="320" height="320" rx="24" class="panel"/>
  <text x="88" y="250" class="h">Input and model</text>

  <rect x="88" y="290" width="245" height="72" rx="14" class="box"/>
  <text x="112" y="321" class="h">Prompt text</text>
  <text x="112" y="345" class="t">"The capital of France is"</text>

  <rect x="88" y="402" width="245" height="72" rx="14" class="box"/>
  <text x="112" y="433" class="h">GPT-2-small</text>
  <text x="112" y="457" class="t">124M parameters, local PyTorch</text>

  <path class="flow" d="M210 362v31"/>

  <rect x="440" y="205" width="330" height="320" rx="24" class="panel"/>
  <text x="470" y="250" class="h">Analysis tools</text>

  <rect x="472" y="292" width="116" height="72" rx="14" class="box2"/>
  <text x="495" y="324" class="small">Logit lens</text>
  <text x="500" y="347" class="t">layers</text>

  <rect x="622" y="292" width="116" height="72" rx="14" class="box2"/>
  <text x="642" y="324" class="small">Attention</text>
  <text x="649" y="347" class="t">heads</text>

  <rect x="472" y="404" width="116" height="72" rx="14" class="box2"/>
  <text x="494" y="436" class="small">Ablation</text>
  <text x="500" y="459" class="t">effects</text>

  <rect x="622" y="404" width="116" height="72" rx="14" class="box2"/>
  <text x="645" y="436" class="small">Patching</text>
  <text x="650" y="459" class="t">traces</text>

  <path class="flow" d="M378 365h52"/>
  <path class="thin" d="M530 364v31"/>
  <path class="thin" d="M680 364v31"/>

  <rect x="830" y="205" width="310" height="320" rx="24" class="panel"/>
  <text x="860" y="250" class="h">Outputs</text>

  <rect x="862" y="292" width="238" height="72" rx="14" class="box"/>
  <text x="890" y="324" class="h">Saved JSON results</text>
  <text x="890" y="348" class="t">prediction, attention, ablation</text>

  <rect x="862" y="404" width="238" height="72" rx="14" class="box"/>
  <text x="890" y="436" class="h">Portfolio preview</text>
  <text x="890" y="460" class="t">fast sample, no public scans</text>

  <path class="flow" d="M770 365h50"/>
  <path class="flow" d="M981 364v31"/>

  <rect x="58" y="578" width="1082" height="90" rx="18" class="panel"/>
  <text x="88" y="613" class="small">Why the full dashboard stays local</text>
  <text x="88" y="643" class="t">The local tool can run arbitrary prompts and heavier interventions. The portfolio uses saved examples so the site stays fast, cheap, and safe to open publicly.</text>

  <g transform="translate(88 698)">
    <rect width="92" height="34" rx="8" fill="rgba(67,216,255,0.13)" stroke="rgba(67,216,255,0.48)"/>
    <text x="28" y="22" class="tag">GPT-2</text>
  </g>
  <g transform="translate(200 698)">
    <rect width="118" height="34" rx="8" fill="rgba(67,216,255,0.13)" stroke="rgba(67,216,255,0.48)"/>
    <text x="22" y="22" class="tag">Logit lens</text>
  </g>
  <g transform="translate(338 698)">
    <rect width="118" height="34" rx="8" fill="rgba(67,216,255,0.13)" stroke="rgba(67,216,255,0.48)"/>
    <text x="25" y="22" class="tag">Attention</text>
  </g>
  <g transform="translate(476 698)">
    <rect width="108" height="34" rx="8" fill="rgba(95,244,180,0.13)" stroke="rgba(95,244,180,0.5)"/>
    <text x="22" y="22" class="tag">Ablation</text>
  </g>
  <g transform="translate(604 698)">
    <rect width="142" height="34" rx="8" fill="rgba(95,244,180,0.13)" stroke="rgba(95,244,180,0.5)"/>
    <text x="20" y="22" class="tag">Static demo</text>
  </g>
</svg>
