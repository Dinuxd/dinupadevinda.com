    <text x="646" y="398" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Keyword search</text>
    <text x="646" y="430" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Exact terms</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="896" y="216" width="218" height="104" rx="14" fill="url(#panel)" stroke="#65f3b2" stroke-opacity="0.5"/>
    <text x="924" y="258" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Vectorize</text>
    <text x="924" y="290" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Semantic matches</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="896" y="356" width="218" height="104" rx="14" fill="url(#panel)" stroke="#65f3b2" stroke-opacity="0.5"/>
    <text x="924" y="398" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Rank fusion</text>
    <text x="924" y="430" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Top evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="618" y="550" width="210" height="104" rx="14" fill="#08131b" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="646" y="592" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Prompt</text>
    <text x="646" y="624" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Rules + evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="896" y="550" width="218" height="104" rx="14" fill="#08131b" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="924" y="592" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Gemini answer</text>
    <text x="924" y="624" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Answer + sources</text>
  </g>

  <path d="M260 300H318" stroke="#45d7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M435 356V470" stroke="#45d7ff" stroke-width="4" stroke-dasharray="9 12" marker-end="url(#arrow-blue)"/>
  <path d="M282 538H332" stroke="#45d7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M540 292H606" stroke="#65f3b2" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M540 326C578 326 580 408 606 408" stroke="#45d7ff" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M828 268H884" stroke="#65f3b2" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M558 538C590 538 586 408 606 408" stroke="#45d7ff" stroke-width="4" fill="none" stroke-dasharray="9 12"/>
  <path d="M828 408H884" stroke="#45d7ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M1005 320V344" stroke="#65f3b2" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M896 408C860 408 860 602 840 602" stroke="#65f3b2" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M828 602H884" stroke="#65f3b2" stroke-width="4" marker-end="url(#arrow-green)"/>

