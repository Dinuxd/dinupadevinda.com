<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio chatbot hybrid RAG architecture</title>
  <desc id="desc">Architecture diagram showing a Next.js chat widget, Cloudflare Worker, portfolio knowledge chunks, Gemini embeddings, Vectorize search, keyword search, rank fusion, Gemini answer generation, and source links.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a26"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45d7ff"/>
      <stop offset="1" stop-color="#65f3b2"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65f3b2"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#070a0f"/>
  <path d="M0 88H1200M0 184H1200M0 280H1200M0 376H1200M0 472H1200M0 568H1200M0 664H1200M120 0V760M240 0V760M360 0V760M480 0V760M600 0V760M720 0V760M840 0V760M960 0V760M1080 0V760" stroke="#ffffff" stroke-opacity="0.05"/>

  <text x="64" y="88" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">PORTFOLIO CHATBOT</text>
  <text x="64" y="132" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">Hybrid RAG workflow</text>
  <text x="66" y="174" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="21">Embeddings, keyword search, rank fusion, Gemini, source links, and evaluation.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="244" width="196" height="112" rx="14" fill="url(#panel)" stroke="#45d7ff" stroke-opacity="0.42"/>
    <text x="92" y="289" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Chat widget</text>
    <text x="92" y="323" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Next.js UI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="244" width="210" height="112" rx="14" fill="url(#panel)" stroke="#45d7ff" stroke-opacity="0.42"/>
    <text x="358" y="289" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Worker API</text>
    <text x="358" y="323" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">CORS + secrets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="482" width="218" height="112" rx="14" fill="#08131b" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="92" y="526" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Knowledge file</text>
    <text x="92" y="560" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">portfolio-chat.json</text>
  </g>

