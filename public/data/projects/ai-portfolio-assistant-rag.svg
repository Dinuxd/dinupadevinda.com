<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio AI assistant RAG workflow</title>
  <desc id="desc">Simple workflow diagram for the portfolio AI assistant. The live chat flow goes from the Next.js chat widget to a Cloudflare Worker, retrieval using Vectorize and keyword search, a grounded Gemini answer, source checking, and a response with links. The separate admin reindex flow converts portfolio-chat.json into chunks, embeds them, and stores them in Cloudflare Vectorize. Docker is shown separately as a local learning and evaluation lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#050b13"/>
      <stop offset="1" stop-color="#061118"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10291f"/>
      <stop offset="1" stop-color="#08161a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-16%" width="120%" height="132%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#45d7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#65f3b2"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <path d="M0 92H1200M0 188H1200M0 284H1200M0 380H1200M0 476H1200M0 572H1200M0 668H1200M120 0V760M240 0V760M360 0V760M480 0V760M600 0V760M720 0V760M840 0V760M960 0V760M1080 0V760" stroke="#ffffff" stroke-opacity="0.055"/>

  <text x="62" y="78" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4">PORTFOLIO AI ASSISTANT</text>
  <text x="62" y="122" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850">Simple RAG workflow</text>
  <text x="64" y="160" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="19">The live chatbot uses retrieved portfolio evidence before Gemini writes the answer.</text>

  <text x="62" y="222" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" letter-spacing="2.6">LIVE CHAT FLOW</text>

  <g filter="url(#shadow)">
    <rect x="62" y="256" width="160" height="104" rx="16" fill="url(#bluePanel)" stroke="#45d7ff" stroke-opacity="0.6"/>
    <text x="86" y="294" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Chat widget</text>
    <text x="86" y="324" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Next.js UI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="282" y="256" width="168" height="104" rx="16" fill="url(#bluePanel)" stroke="#45d7ff" stroke-opacity="0.6"/>
    <text x="306" y="294" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Worker API</text>
    <text x="306" y="324" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">CORS, secrets,</text>
    <text x="306" y="346" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">rate limits</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="236" width="188" height="144" rx="18" fill="url(#greenPanel)" stroke="#65f3b2" stroke-opacity="0.58"/>
    <text x="534" y="274" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Retrieve</text>
    <text x="534" y="301" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">evidence</text>
    <text x="534" y="331" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Vectorize search</text>
    <text x="534" y="354" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">+ keyword search</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="758" y="246" width="170" height="124" rx="16" fill="#0b151d" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="782" y="288" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Grounded</text>
    <text x="782" y="313" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Gemini</text>
    <text x="782" y="338" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">answer</text>
    <text x="782" y="360" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="13">Prompt + evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="988" y="256" width="150" height="104" rx="16" fill="url(#bluePanel)" stroke="#45d7ff" stroke-opacity="0.6"/>
    <text x="1012" y="294" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Response</text>
    <text x="1012" y="324" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Checked answer</text>
    <text x="1012" y="346" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">+ source links</text>
  </g>

  <path d="M222 308H270" stroke="#45d7ff" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M450 308H498" stroke="#65f3b2" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M698 308H746" stroke="#65f3b2" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M928 308H976" stroke="#45d7ff" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <text x="62" y="462" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="850" letter-spacing="2.6">ADMIN REINDEX FLOW</text>

  <g filter="url(#shadow)">
    <rect x="62" y="496" width="180" height="92" rx="15" fill="#0b151d" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="86" y="532" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Knowledge file</text>
    <text x="86" y="560" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">portfolio-chat.json</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="306" y="496" width="164" height="92" rx="15" fill="#0b151d" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="330" y="532" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Typed chunks</text>
    <text x="330" y="560" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Projects, skills, CV</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="534" y="496" width="172" height="92" rx="15" fill="url(#greenPanel)" stroke="#65f3b2" stroke-opacity="0.58"/>
    <text x="558" y="532" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Embeddings</text>
    <text x="558" y="560" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Gemini Embedding 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="496" width="172" height="92" rx="15" fill="url(#greenPanel)" stroke="#65f3b2" stroke-opacity="0.58"/>
    <text x="794" y="532" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">Vector index</text>
    <text x="794" y="560" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Cloudflare Vectorize</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1002" y="496" width="136" height="92" rx="15" fill="#09131b" stroke="#65f3b2" stroke-opacity="0.36"/>
    <text x="1024" y="532" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Local lab</text>
    <text x="1024" y="560" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Docker, Python,</text>
    <text x="1024" y="580" fill="#9fb0c5" font-family="Inter, Arial, sans-serif" font-size="15">Chroma, eval</text>
  </g>

  <path d="M242 542H294" stroke="#65f3b2" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M470 542H522" stroke="#65f3b2" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M706 542H758" stroke="#65f3b2" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M942 542H990" stroke="#65f3b2" stroke-width="4" stroke-dasharray="9 12"/>

  <g>
    <rect x="62" y="666" width="96" height="34" rx="8" fill="#45d7ff" fill-opacity="0.12" stroke="#45d7ff" stroke-opacity="0.45"/>
    <text x="86" y="689" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">RAG</text>
    <rect x="176" y="666" width="132" height="34" rx="8" fill="#45d7ff" fill-opacity="0.12" stroke="#45d7ff" stroke-opacity="0.45"/>
    <text x="194" y="689" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Embeddings</text>
    <rect x="326" y="666" width="122" height="34" rx="8" fill="#45d7ff" fill-opacity="0.12" stroke="#45d7ff" stroke-opacity="0.45"/>
    <text x="344" y="689" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Vector DB</text>
    <rect x="466" y="666" width="94" height="34" rx="8" fill="#65f3b2" fill-opacity="0.12" stroke="#65f3b2" stroke-opacity="0.45"/>
    <text x="486" y="689" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Docker</text>
    <rect x="578" y="666" width="124" height="34" rx="8" fill="#65f3b2" fill-opacity="0.12" stroke="#65f3b2" stroke-opacity="0.45"/>
    <text x="596" y="689" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Evaluation</text>
    <rect x="720" y="666" width="116" height="34" rx="8" fill="#65f3b2" fill-opacity="0.12" stroke="#65f3b2" stroke-opacity="0.45"/>
    <text x="738" y="689" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Security</text>
  </g>
</svg>
