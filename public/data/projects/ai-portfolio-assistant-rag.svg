    <text x="646" y="258" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Embedding</text>
    <text x="646" y="290" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="17">Question vector</text>
