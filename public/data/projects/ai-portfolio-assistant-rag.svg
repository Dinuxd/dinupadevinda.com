    <rect x="64" y="690" width="102" height="34" rx="8" fill="#45d7ff" fill-opacity="0.12" stroke="#45d7ff" stroke-opacity="0.45"/>
    <text x="84" y="713" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">RAG</text>
    <rect x="184" y="690" width="132" height="34" rx="8" fill="#45d7ff" fill-opacity="0.12" stroke="#45d7ff" stroke-opacity="0.45"/>
    <text x="202" y="713" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Embeddings</text>
    <rect x="334" y="690" width="146" height="34" rx="8" fill="#45d7ff" fill-opacity="0.12" stroke="#45d7ff" stroke-opacity="0.45"/>
    <text x="352" y="713" fill="#45d7ff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Vector DB</text>
    <rect x="498" y="690" width="142" height="34" rx="8" fill="#65f3b2" fill-opacity="0.12" stroke="#65f3b2" stroke-opacity="0.45"/>
    <text x="516" y="713" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Evaluation</text>
    <rect x="658" y="690" width="132" height="34" rx="8" fill="#65f3b2" fill-opacity="0.12" stroke="#65f3b2" stroke-opacity="0.45"/>
    <text x="676" y="713" fill="#65f3b2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Security</text>
